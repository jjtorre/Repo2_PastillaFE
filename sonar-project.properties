# Configuracion del analisis de SonarCloud.
#
# Los dos valores de abajo hay que ajustarlos a los que SonarCloud asigne al
# crear el proyecto: aparecen en Administration > Update Key y en la pagina de
# la organizacion.
sonar.projectKey=jjtorre_Repo2_PastillaFE
sonar.organization=jjtorre

sonar.projectName=Pastilla
sonar.projectVersion=1.0

# Que se analiza. Se incluyen los tres bloques del repositorio para que el
# recuento de lineas refleje el proyecto real y no solo una parte.
sonar.sources=myApp,web/src,web/api,Migration
sonar.tests=tests

# Que NO se analiza.
#
# node_modules y dist son dependencias y artefactos generados: medirlos
# inflaria el recuento y llenaria el informe de problemas ajenos. La cobertura
# tambien se excluye como fuente, porque es un artefacto, aunque se lee como
# informe mas abajo.
sonar.exclusions=**/node_modules/**,**/dist/**,coverage/**,**/*.tsbuildinfo,myApp/assets/**,web/public/**

# Informe de cobertura en formato LCOV, generado por "npm run coverage".
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Las rutas del informe de cobertura son relativas a la raiz del repositorio.
sonar.sourceEncoding=UTF-8
