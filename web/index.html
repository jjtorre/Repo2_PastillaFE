<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Verificación de propiedad del despliegue. Va en el HTML servido, no
         en el README: el validador comprueba el sitio publicado. El mismo
         código está también en /verificacion.txt. -->
    <meta name="verification" content="LEARN-CAP-C366ADC1" />
    <meta name="learn-cap-verification" content="LEARN-CAP-C366ADC1" />

    <!-- Cada meta en UNA sola línea a propósito: un parser de HTML da igual,
         pero los validadores y rastreadores que usan expresiones regulares no
         encuentran un atributo partido en varias líneas. -->
    <meta name="description" content="Seguimiento de medicación para personas mayores. El paciente marca sus dosis en el teléfono, incluso sin internet, y su familia ve desde el navegador si ya se las tomó hoy." />
    <link rel="canonical" href="https://amelia.lat/" />

    <!-- Open Graph. Las URL deben ser absolutas: los rastreadores no
         resuelven rutas relativas al previsualizar un enlace. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pastilla" />
    <meta property="og:locale" content="es_HN" />
    <meta property="og:url" content="https://amelia.lat/" />
    <meta property="og:title" content="Pastilla — Que nadie olvide su medicina" />
    <meta property="og:description" content="Seguimiento de medicación para personas mayores. El paciente marca sus dosis en el teléfono, incluso sin internet, y su familia ve desde el navegador si ya se las tomó hoy." />
    <meta property="og:image" content="https://amelia.lat/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Icono de la aplicación Pastilla" />

    <!-- "summary" y no "summary_large_image": la imagen es cuadrada, y el
         formato grande la recortaría por arriba y por abajo. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pastilla — Que nadie olvide su medicina" />
    <meta name="twitter:description" content="El paciente marca sus dosis en el teléfono, incluso sin internet, y su familia lo ve desde el navegador." />
    <meta name="twitter:image" content="https://amelia.lat/og-image.png" />

    <title>Panel del cuidador · Pastilla</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
