<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Página no encontrada · Pastilla</title>
    <!--
      Estilos en línea a propósito. Esta página la sirve Vercel cuando ninguna
      ruta coincide, así que no debe depender del CSS con hash del build: si
      ese archivo cambiara de nombre o fallara, el 404 se vería roto justo
      cuando algo ya ha ido mal.
    -->
    <style>
      :root {
        --background: #fbf8f3;
        --surface: #ffffff;
        --surface-border: #e5dfd3;
        --text-primary: #1f3a3d;
        --text-secondary: #8b7355;
        --primary: #2d6e5e;
        --primary-text: #fbf8f3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--background);
        color: var(--text-primary);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 460px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 16px;
        padding: 40px 32px;
        text-align: center;
      }
      .codigo {
        font-size: 56px;
        font-weight: 700;
        color: var(--primary);
        margin: 0 0 8px;
        letter-spacing: 2px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px;
      }
      p {
        color: var(--text-secondary);
        font-size: 16px;
        line-height: 1.55;
        margin: 0 0 28px;
      }
      a {
        display: inline-block;
        background: var(--primary);
        color: var(--primary-text);
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 28px;
        border-radius: 28px;
      }
      @media (max-width: 480px) {
        main {
          padding: 32px 20px;
        }
        .codigo {
          font-size: 44px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="codigo">404</p>
      <h1>Esta página no existe</h1>
      <p>
        Puede que el enlace esté mal escrito o que la página se haya movido.
        Desde el inicio puedes llegar al panel del cuidador.
      </p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
