<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pastilla">
  <!-- Mismo motivo que los PNG generados por scripts/generar-icono.mjs, pero
       vectorial: la pestaña del navegador lo pinta a 16px y un SVG se mantiene
       nítido donde un mapa de bits se emborrona. -->
  <rect width="64" height="64" fill="#2D6E5E"/>
  <g transform="rotate(-38 32 32)">
    <rect x="14" y="23" width="36" height="18" rx="9" fill="#FBF8F3"/>
    <path d="M32 23 H41 a9 9 0 0 1 0 18 H32 Z" fill="#E8EFE9"/>
    <line x1="32" y1="23" x2="32" y2="41" stroke="#2D6E5E" stroke-width="1.8"/>
  </g>
</svg>
